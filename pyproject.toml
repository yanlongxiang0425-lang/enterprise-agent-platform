[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-platform"
version = "0.4.0"
description = "Common enterprise agent platform with material classification as the first production agent capability."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<2.0",
  "openpyxl>=3.1,<4.0",
  "xlrd>=2.0,<3.0",
  "langgraph>=1.0",
  "langchain>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
agent-platform = "material_agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent_platform*", "material_agent*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

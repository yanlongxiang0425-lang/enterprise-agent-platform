services:
  agent-platform-api:
    build: .
    image: enterprise-agent-platform:0.4.0
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./交付物/material_agent_outputs:/app/交付物/material_agent_outputs
      - ./交付物/material_agent_tasks:/app/交付物/material_agent_tasks
      - ./交付物/knowledge_bases:/app/交付物/knowledge_bases
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
